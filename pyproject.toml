[project]
name = "shared-context"
version = "0.0.1"
description = "Team-shared, episodic-first context layer for coding agents"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
  "typer>=0.12",
]

[project.scripts]
ctx = "shared_context.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared_context"]

[dependency-groups]
dev = ["pytest>=8"]
